<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>サポート — SubscSmart</title>
<style>
  :root {
    --c-bg: #fafaf7;
    --c-fg: #1f2024;
    --c-muted: #6b7077;
    --c-line: #e6e4de;
    --c-accent: #10b981;
    --radius: 10px;
    --font-body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
    --maxw: 560px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --c-bg: #0f172a; --c-fg: #ececef; --c-muted: #9aa0a8; --c-line: #2c2e36; --c-accent: #34d399; }
  }
  body { margin: 0; background: var(--c-bg); color: var(--c-fg); font: 16px/1.7 var(--font-body); }
  main { max-width: var(--maxw); margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 28px; margin: 0 0 12px; }
  .meta { color: var(--c-muted); font-size: 14px; margin-bottom: 32px; }
  a { color: var(--c-accent); }
  .card {
    background: rgba(16, 185, 129, 0.08);
    border: 1px solid var(--c-line);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin: 24px 0;
  }
  .btn {
    display: inline-block;
    margin-top: 12px;
    padding: 12px 20px;
    background: var(--c-accent);
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
  }
  footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--c-line); color: var(--c-muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>SubscSmart サポート</h1>
  <p class="meta">最終更新: 2026-05-25</p>

  <p>不具合の報告、機能のご要望、プライバシーに関するお問い合わせは GitHub Issues からお願いします。</p>

  <div class="card">
    <strong>お問い合わせ（推奨）</strong>
    <p style="margin: 8px 0 0; font-size: 15px;">公開リポジトリの Issue トラッカーです。再現手順と端末・OS バージョンを書いていただけると助かります。</p>
    <a class="btn" href="https://github.com/ryusei04-beep/subscsmart-legal/issues/new/choose">新しい Issue を作成</a>
  </div>

  <p>関連ドキュメント:</p>
  <ul>
    <li><a href="privacy.html">プライバシーポリシー</a></li>
    <li><a href="terms.html">利用規約</a></li>
  </ul>

  <footer>
    <p>SubscSmart</p>
  </footer>
</main>
</body>
</html>
